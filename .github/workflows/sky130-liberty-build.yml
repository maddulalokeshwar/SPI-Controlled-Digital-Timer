name: Sky130 Liberty Library Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/sky130-liberty-build.yml"
      - "Results/sta/**"
      - "Results/synthesis/sky130/**"

permissions:
  contents: read

jobs:
  build-liberty:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download official SkyWater PDK
        run: |
          git clone --depth 1 https://github.com/google/skywater-pdk.git /tmp/skywater-pdk
          cd /tmp/skywater-pdk
          git submodule update --init --depth 1 libraries/sky130_fd_sc_hd/latest

      - name: Install official Liberty generator
        run: |
          python -m pip install --upgrade pip
          python -m pip install /tmp/skywater-pdk/scripts/python-skywater-pdk

      - name: Generate SS TT and FF libraries
        run: |
          mkdir -p Results/Liberty

          python -c 'from skywater_pdk.liberty import main; raise SystemExit(main())' \
            /tmp/skywater-pdk/libraries/sky130_fd_sc_hd/latest \
            ss_100C_1v60 \
            tt_025C_1v80 \
            ff_n40C_1v95 \
            -o Results/Liberty

      - name: Run SS TT and FF multi-corner STA
        run: |
          set -euo pipefail
          mkdir -p Results/sta/mcsta

          run_corner() {
            corner="$1"
            lib="$2"
            delay="$3"
            oc="${lib#sky130_fd_sc_hd__}"
            oc="${oc%.lib}"

            cat > "Results/sta/mcsta/${corner}.tcl" <<EOF
          read_lef /OpenROAD-flow-scripts/flow/platforms/sky130hd/lef/sky130_fd_sc_hd.tlef
          read_lef /OpenROAD-flow-scripts/flow/platforms/sky130hd/lef/sky130_fd_sc_hd_merged.lef
          read_liberty /work/Results/Liberty/${lib}
          set_operating_conditions -analysis_type single -library sky130_fd_sc_hd__${oc} ${oc}
          read_verilog /work/Results/synthesis/sky130/spi_timer_top_sky130.v
          link_design spi_timer_top
          read_sdc /work/Results/sta/spi_timer.sdc

          puts "===== ${corner} TIMING ANALYSIS ====="
          check_setup -verbose
          report_checks -path_delay ${delay} -format full_clock_expanded -group_count 10
          report_worst_slack
          report_tns
          EOF

            docker run --rm \
              -v "${GITHUB_WORKSPACE}:/work" \
              -w /work \
              openroad/orfs \
              bash -lc "source /OpenROAD-flow-scripts/env.sh && openroad -exit /work/Results/sta/mcsta/${corner}.tcl" \
              2>&1 | tee "Results/sta/mcsta/${corner}.log"
          }

          run_corner SS sky130_fd_sc_hd__ss_100C_1v60.lib max
          run_corner TT sky130_fd_sc_hd__tt_025C_1v80.lib max
          run_corner FF sky130_fd_sc_hd__ff_n40C_1v95.lib min

          echo "All three corner analyses completed."

      - name: Verify generated libraries
        run: |
          echo "=== Generated Liberty files ==="
          ls -lh Results/Liberty/*.lib

          test -s Results/Liberty/sky130_fd_sc_hd__ss_100C_1v60.lib
          test -s Results/Liberty/sky130_fd_sc_hd__tt_025C_1v80.lib
          test -s Results/Liberty/sky130_fd_sc_hd__ff_n40C_1v95.lib

      - name: Upload multi-corner STA reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sky130-multi-corner-sta-reports
          path: Results/sta/mcsta/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Liberty libraries
        uses: actions/upload-artifact@v4
        with:
          name: sky130-hd-liberty-libraries
          path: Results/Liberty/*.lib
          if-no-files-found: error
          retention-days: 14
