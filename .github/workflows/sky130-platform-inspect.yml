name: Sky130 Platform Configuration Inspection

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-platform:
    runs-on: ubuntu-24.04
    steps:
      - name: Search all available Sky130 timing libraries
        run: |
          docker run --rm openroad/orfs bash -lc '
            echo "=== Sky130 HD platform libraries ==="
            find /OpenROAD-flow-scripts/flow/platforms/sky130hd \
              -type f \( -name "*.lib" -o -name "*.lib.gz" \) | sort

            echo "=== Sky130 libraries across container ==="
            find / -type f \
              \( -name "sky130_fd_sc_hd__*.lib" \
              -o -name "sky130_fd_sc_hd__*.lib.gz" \) \
              -print 2>/dev/null | sort
          '
