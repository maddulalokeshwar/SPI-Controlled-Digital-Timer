name: Sky130 Platform Configuration Inspection

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-platform:
    runs-on: ubuntu-24.04
    steps:
      - name: Inspect Sky130 platform configuration
        run: |
          docker run --rm openroad/orfs bash -lc '
            set -e
            PLATFORM=/OpenROAD-flow-scripts/flow/platforms/sky130hd

            echo "=== Liberty configuration references ==="
            grep -RniE "LIB|liberty|corner|tt|ss|ff" \
              "$PLATFORM/config.mk" \
              "$PLATFORM"/*.mk 2>/dev/null || true

            echo "=== All Sky130 HD library files ==="
            find "$PLATFORM" -type f \
              \( -name "*.lib" -o -name "*.lib.gz" \) | sort

            echo "=== Timing-related configuration files ==="
            find "$PLATFORM" -maxdepth 2 -type f \
              \( -name "*.mk" -o -name "*.tcl" \) | sort
          '
